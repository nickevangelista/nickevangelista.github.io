baseURL = 'https://nickevangelista.github.io/'
languageCode = 'en-us'
defaultContentLanguage = 'en'
title = "Nícolas Evangelista"

[params]
  description = "Essays and notes by Nícolas Evangelista on technology, artificial intelligence, and the decisions around them."
  dateFormat = "January 2, 2006"

  [params.navbar]
    displayLogo = false

  [params.footer]
    displayPoweredBy = false
    displayCopyright = true

  [params.page.contextMenu]
    enable = false

  [params.theme]
    default = "system"

[[menu.main]]
  name = "Notes"
  pageRef = "/notes"
  weight = 1

[[menu.main]]
  name = "About"
  pageRef = "/about"
  weight = 2

[[menu.main]]
  name = "Search"
  weight = 50
  [menu.main.params]
    type = "search"

[[menu.main]]
  name = "RSS"
  url = "/notes/index.xml"
  weight = 60
  params = { icon = "rss" }

[[menu.main]]
  name = "GitHub"
  url = "https://github.com/nickevangelista"
  weight = 70
  params = { icon = "github" }

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"
